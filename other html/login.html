<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Discovra</title>
    <link rel="stylesheet" href="../other css/style.css">
</head>

<body class="auth-page">
    <header class="site-header"><a class="brand" href="..index.html">Discovra<span>.</span></a><a class="text-link"
            href="../index.html">← Back home</a></header>
    <main class="auth-wrap">
        <form class="auth-card demo-form">
            <p class="eyebrow">Welcome back</p>
            <h1>Log in to Discovra</h1>
            <p class="muted">Continue discovering, sharing, and building.</p><label>Email address<input type="email"
                    name="email" placeholder="you@example.com" required></label><label>Password<input type="password"
                    name="password" placeholder="Enter your password" required></label><button
                class="button button-full" type="submit">Log in</button>
            <p class="form-message" aria-live="polite"></p>
            <p class="auth-switch">New to Discovra? <a href="../other html/signup.html">Create an account</a></p>
            <p class="tiny-note">Demo only: authentication is not connected yet.</p>
        </form>
    </main>
    <script src="../script.js"></script>
</body>

</html>
