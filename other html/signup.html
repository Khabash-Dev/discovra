<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Discovra</title>
    <link rel="stylesheet" href="../other css/style.css">
</head>

<body class="auth-page">
    <header class="site-header"><a class="brand" href="../index.html">Discovra<span>.</span></a><a class="text-link"
            href="../index.html">← Back home</a></header>
    <main class="auth-wrap">
        <form class="auth-card demo-form">
            <p class="eyebrow">Join the community</p>
            <h1>Create your account</h1>
            <p class="muted">Make your skills and projects easier to discover.</p><label>Full name<input type="text"
                    name="name" placeholder="Enter your name" required></label><label>Email address<input type="email"
                    name="email" placeholder="you@example.com" required></label><label>Create password<input
                    type="password" name="password" minlength="6" placeholder="At least 6 characters"
                    required></label><label>Main skill area<select required>
                    <option value="">Choose your area</option>
                    <option>Frontend development</option>
                    <option>Backend development</option>
                    <option>UI/UX design</option>
                    <option>Data and AI</option>
                    <option>Engineering and hardware</option>
                    <option>Other</option>
                </select></label><button class="button button-full" type="submit">Create account</button>
            <p class="form-message" aria-live="polite"></p>
            <p class="auth-switch">Already have an account? <a href="../other html/login.html">Log in</a></p>
            <p class="tiny-note">Demo only: this form does not create or store an account yet.</p>
        </form>
    </main>
    <script src="../script.js"></script>
</body>

</html>
